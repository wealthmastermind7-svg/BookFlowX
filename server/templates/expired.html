<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Booking Link Expired</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 32px;
      padding: 48px 32px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .logo {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 40px;
      letter-spacing: -0.5px;
    }
    .title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .message {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.6;
    }
    .business-name {
      color: #fff;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">BookFlow</div>
    <div class="title">Booking link expired</div>
    <div class="message">
      The booking link for <span class="business-name">{{businessName}}</span> has expired. Please contact the business owner directly to book your appointment.
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join BookFlow</title>
</head>
<body style="margin: 0; padding: 0; background-color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #000000;">
    <tr>
      <td align="center" style="padding: 40px 20px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width: 440px; background-color: #000000;">
          
          <!-- Share Preview Header -->
          <tr>
            <td style="padding-bottom: 24px; text-align: left;">
              <h1 style="margin: 0; font-size: 34px; font-weight: 700; color: #ffffff;">Share Preview</h1>
              <p style="margin: 8px 0 0; font-size: 17px; color: rgba(255,255,255,0.6);">This is how your booking link appears when shared</p>
            </td>
          </tr>

          <!-- Chat Bubble Mockup -->
          <tr>
            <td style="padding: 24px 0; text-align: right;">
              <div style="display: inline-block; background-color: #007AFF; border-radius: 20px; padding: 12px 20px; color: #ffffff; font-size: 17px;">
                Hey! Here's my booking link 👇
              </div>
            </td>
          </tr>

          <!-- Reserve Your Space Card -->
          <tr>
            <td style="padding: 20px; background: linear-gradient(135deg, #1a1a1a 0%, #000000 100%); border-radius: 28px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 40px rgba(0,0,0,0.5);">
              <div style="padding: 40px 20px; border-bottom: 1px solid rgba(255,255,255,0.05);">
                <h2 style="margin: 0; font-size: 56px; font-weight: 700; color: #ffffff; line-height: 0.9; letter-spacing: -2px; text-transform: uppercase;">RESERVE<br>YOUR<br>SPACE</h2>
                <div style="width: 60px; height: 3px; background-color: #ffffff; margin-top: 24px;"></div>
              </div>
              <div style="padding: 24px 20px; display: flex; align-items: center; justify-content: space-between;">
                <div style="display: flex; align-items: center;">
                  <div style="width: 40px; height: 40px; background-color: #ffffff; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-right: 12px;">
                    <span style="font-size: 20px;">😊</span>
                  </div>
                  <div>
                    <div style="font-size: 17px; font-weight: 600; color: #ffffff;">{{businessName}}</div>
                    <div style="font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px;">BOOK YOUR APPOINTMENT</div>
                    <div style="font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 1px;">CONFIRMBOOKING.ONLINE</div>
                  </div>
                </div>
                <div style="width: 32px; height: 32px; background-color: rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                  <span style="color: #ffffff; font-size: 16px;">↗</span>
                </div>
              </div>
            </td>
          </tr>

          <!-- URL Section -->
          <tr>
            <td style="padding-top: 40px; text-align: center;">
              <div style="background-color: rgba(255,255,255,0.05); border-radius: 16px; padding: 20px; border: 1px solid rgba(255,255,255,0.05);">
                 <p style="margin: 0 0 8px; font-size: 13px; color: rgba(255,255,255,0.4);">Your Booking URL</p>
                 <a href="{{bookingUrl}}" style="font-size: 15px; color: #ffffff; text-decoration: none; word-break: break-all;">{{bookingUrl}}</a>
              </div>
            </td>
          </tr>

          <!-- CTA Section -->
          <tr>
            <td style="padding-top: 24px;">
              <a href="{{bookingUrl}}" style="display: block; background-color: #ffffff; border-radius: 100px; padding: 20px; text-align: center; color: #000000; font-size: 17px; font-weight: 600; text-decoration: none;">Book Now</a>
            </td>
          </tr>

          <!-- Branding -->
          <tr>
            <td style="padding-top: 48px; text-align: center;">
              <p style="margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: 4px; color: rgba(255,255,255,0.2);">
                POWERED BY BOOKFLOW
              </p>
            </td>
          </tr>
          
        </table>
      </td>
    </tr>
  </table>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Voice Booking - {{BUSINESS_NAME}}</title>
  <meta name="description" content="Book appointments with {{BUSINESS_NAME}} using our AI voice assistant">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --pure-black: #000000;
      --charcoal: #1a1a1a;
      --graphite: #2d2d2d;
      --smoke: #404040;
      --silver: #808080;
      --pearl: #f5f5f5;
      --pure-white: #ffffff;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--pure-black);
      color: var(--pure-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 40px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    .business-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: var(--pearl);
    }

    .title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -2px;
      line-height: 1.1;
    }

    .subtitle {
      font-size: 16px;
      color: var(--silver);
      font-weight: 300;
      max-width: 320px;
      line-height: 1.6;
    }

    .voice-button-container {
      position: relative;
      margin: 24px 0;
    }

    .pulse-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.1);
      animation: pulse 2s ease-out infinite;
      pointer-events: none;
    }

    .pulse-ring:nth-child(2) {
      animation-delay: 0.5s;
    }

    .pulse-ring:nth-child(3) {
      animation-delay: 1s;
    }

    @keyframes pulse {
      0% {
        transform: translate(-50%, -50%) scale(0.8);
        opacity: 1;
      }
      100% {
        transform: translate(-50%, -50%) scale(1.5);
        opacity: 0;
      }
    }

    .voice-button {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--graphite), var(--charcoal));
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 
        0 4px 24px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .voice-button:hover {
      transform: scale(1.05);
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    .voice-button:active {
      transform: scale(0.98);
    }

    .voice-button.recording {
      background: linear-gradient(135deg, #dc2626, #991b1b);
      animation: glow 1.5s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from {
        box-shadow: 
          0 4px 24px rgba(220, 38, 38, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
      }
      to {
        box-shadow: 
          0 8px 48px rgba(220, 38, 38, 0.6),
          inset 0 1px 0 rgba(255, 255, 255, 0.15);
      }
    }

    .voice-button.processing {
      background: linear-gradient(135deg, var(--smoke), var(--graphite));
      animation: processingPulse 1s ease-in-out infinite;
    }

    @keyframes processingPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .mic-icon {
      width: 48px;
      height: 48px;
      color: var(--pure-white);
      transition: transform 0.3s ease;
    }

    .voice-button.recording .mic-icon {
      transform: scale(1.1);
    }

    .status-text {
      font-size: 14px;
      color: var(--silver);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 2px;
      min-height: 20px;
      cursor: pointer;
    }

    .transcript-area {
      width: 100%;
      max-height: 200px;
      overflow-y: auto;
      padding: 16px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .transcript-line {
      font-size: 14px;
      line-height: 1.6;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .transcript-line:last-child {
      border-bottom: none;
    }

    .transcript-line.user {
      color: var(--silver);
    }

    .transcript-line.user::before {
      content: "You: ";
      color: var(--smoke);
    }

    .transcript-line.assistant {
      color: var(--pearl);
    }

    .transcript-line.assistant::before {
      content: "Agent: ";
      color: var(--smoke);
    }

    .footer-links {
      display: flex;
      gap: 24px;
      margin-top: 16px;
    }

    .footer-link {
      color: var(--silver);
      text-decoration: none;
      font-size: 13px;
      font-weight: 400;
      transition: color 0.2s ease;
    }

    .footer-link:hover {
      color: var(--pearl);
    }

    .powered-by {
      font-size: 12px;
      color: var(--smoke);
      margin-top: 8px;
    }

    .powered-by a {
      color: var(--silver);
      text-decoration: none;
    }

    .error-message {
      background: rgba(220, 38, 38, 0.1);
      border: 1px solid rgba(220, 38, 38, 0.3);
      color: #fca5a5;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }

    .error-message.visible {
      display: block;
    }

    @media (max-width: 480px) {
      .title {
        font-size: 36px;
      }
      .voice-button {
        width: 140px;
        height: 140px;
      }
      .mic-icon {
        width: 40px;
        height: 40px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="business-name">{{BUSINESS_NAME}}</div>
    
    <h1 class="title">VOICE<br>BOOKING</h1>
    
    <div style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 24px; border-radius: 20px; margin: 20px 0;">
      <h2 style="font-family: 'Cormorant Garamond', serif; font-size: 24px; margin-bottom: 8px;">Maintenance</h2>
      <p class="subtitle" style="margin: 0 auto;">
        The AI Voice Receptionist is currently undergoing maintenance and will be available soon. Please use our text-based booking flow in the meantime.
      </p>
    </div>

    <div class="voice-button-container" style="opacity: 0.3; pointer-events: none;">
      <div class="pulse-ring"></div>
      <div class="pulse-ring"></div>
      <div class="pulse-ring"></div>
      <button class="voice-button" id="voiceButton" aria-label="Start voice recording">
        <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" x2="12" y1="19" y2="22"/>
        </svg>
      </button>
    </div>

    <div class="status-text" id="statusText">HOLD TO SPEAK</div>

    <div class="error-message" id="errorMessage"></div>

    <div class="transcript-area" id="transcriptArea" style="display: none;"></div>

    <div class="footer-links">
      <a href="/book/{{BUSINESS_SLUG}}" class="footer-link">Text Booking</a>
      <a href="/voice/{{BUSINESS_SLUG}}?turbo={{NEXT_TURBO}}" class="footer-link">{{TURBO_TEXT}}</a>
      <a href="https://apps.apple.com/app/bookflowx/id6756943439" class="footer-link">Get the App</a>
    </div>

    <div class="powered-by">
      Powered by <a href="https://confirmbooking.online">BookFlow</a>
    </div>
  </div>

  <script>
    const businessSlug = '{{BUSINESS_SLUG}}';
    const isTurbo = '{{IS_TURBO}}' === 'true';
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    const voiceButton = document.getElementById('voiceButton');
    const statusText = document.getElementById('statusText');
    const transcriptArea = document.getElementById('transcriptArea');
    const errorMessage = document.getElementById('errorMessage');

    let mediaRecorder = null;
    let audioChunks = [];
    let conversationHistory = [];
    let isProcessing = false;
    let currentAudio = null;

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.add('visible');
      setTimeout(() => {
        errorMessage.classList.remove('visible');
      }, 5000);
    }

    function addTranscript(role, text) {
      if (!text) return;
      transcriptArea.style.display = 'block';
      const line = document.createElement('div');
      line.className = `transcript-line ${role}`;
      line.textContent = text;
      transcriptArea.appendChild(line);
      transcriptArea.scrollTop = transcriptArea.scrollHeight;
    }

    async function startRecording() {
      if (isProcessing) return;
      
      if (isTurbo) {
        if (isIOS) {
          showError("Turbo Mode is currently unavailable on iOS TestFlight. Switching to Standard.");
          setTimeout(() => {
            window.location.href = `/voice/${businessSlug}?turbo=false`;
          }, 2000);
          return;
        }
        startTurboMode();
        return;
      }

      // Stop any playing audio
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
      
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
            sampleRate: 16000,
          }
        });
        
        // Choose best available format
        const mimeType = isIOS 
          ? 'audio/wav' 
          : MediaRecorder.isTypeSupported('audio/webm;codecs=opus') 
            ? 'audio/webm;codecs=opus' 
            : MediaRecorder.isTypeSupported('audio/webm') 
              ? 'audio/webm' 
              : MediaRecorder.isTypeSupported('audio/mp4')
                ? 'audio/mp4'
                : '';

        const options = mimeType ? { mimeType } : {};
        mediaRecorder = new MediaRecorder(stream, options);
        audioChunks = [];

        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) {
            audioChunks.push(event.data);
          }
        };

        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach(track => track.stop());
          
          if (audioChunks.length === 0) {
            showError('No audio recorded. Please try again.');
            statusText.textContent = 'HOLD TO SPEAK';
            return;
          }
          
          const audioBlob = new Blob(audioChunks, { type: mimeType || 'audio/webm' });
          console.log(`[VoiceAgent] Recorded ${audioBlob.size} bytes of audio`);
          
          if (audioBlob.size < 1000) {
            showError('Recording too short. Please hold longer and speak clearly.');
            statusText.textContent = 'HOLD TO SPEAK';
            return;
          }
          
          await sendAudio(audioBlob);
        };

        mediaRecorder.start(100); // Collect data every 100ms
        voiceButton.classList.add('recording');
        statusText.textContent = 'LISTENING...';
      } catch (error) {
        console.error('Recording error:', error);
        showError('Please allow microphone access to use voice booking.');
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        voiceButton.classList.remove('recording');
        voiceButton.classList.add('processing');
        statusText.textContent = 'PROCESSING...';
      }
    }

    // Turbo Mode (Realtime WebRTC) Implementation
    let pc = null;
    let dataChannel = null;

    async function startTurboMode() {
      if (pc) return;
      
      statusText.textContent = 'CONNECTING TURBO...';
      voiceButton.classList.add('processing');

      try {
        const tokenRes = await fetch(`/api/voice/${businessSlug}/token`);
        const { client_secret } = await tokenRes.json();

        pc = new RTCPeerConnection();
        
        const audioEl = document.createElement("audio");
        audioEl.autoplay = true;
        pc.ontrack = e => audioEl.srcObject = e.streams[0];

        const ms = await navigator.mediaDevices.getUserMedia({ audio: true });
        pc.addTrack(ms.getTracks()[0]);

        dataChannel = pc.createDataChannel("oai-events");
        dataChannel.addEventListener("open", () => {
          statusText.textContent = 'TURBO ACTIVE';
          voiceButton.classList.remove('processing');
          voiceButton.classList.add('recording');
          
          // Configure the session
          dataChannel.send(JSON.stringify({
            type: "session.update",
            session: {
              instructions: `You are a booking assistant for ${document.querySelector('.business-name').textContent}. Be concise and helpful.`,
              voice: "verse",
              input_audio_format: "pcm16",
              output_audio_format: "pcm16",
              turn_detection: { type: "server_vad" }
            }
          }));
        });

        dataChannel.addEventListener("message", (e) => {
          const serverEvent = JSON.parse(e.data);
          if (serverEvent.type === "response.audio_transcript.done") {
            addTranscript('assistant', serverEvent.transcript);
          }
          if (serverEvent.type === "conversation.item.input_audio_transcription.completed") {
            addTranscript('user', serverEvent.transcript);
          }
        });

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        const baseUrl = "https://api.openai.com/v1/realtime";
        const model = "gpt-4o-realtime-preview-2024-12-17";
        const sdpRes = await fetch(`${baseUrl}?model=${model}`, {
          method: "POST",
          body: offer.sdp,
          headers: {
            Authorization: `Bearer ${client_secret.value}`,
            "Content-Type": "application/sdp"
          }
        });

        const answer = { type: "answer", sdp: await sdpRes.text() };
        await pc.setRemoteDescription(answer);

      } catch (err) {
        console.error("Turbo Mode Error:", err);
        showError("Turbo Mode failed to start.");
        statusText.textContent = 'HOLD TO SPEAK';
        voiceButton.classList.remove('processing');
      }
    }

    function stopTurboMode() {
      if (pc) {
        pc.close();
        pc = null;
        dataChannel = null;
        voiceButton.classList.remove('recording');
        voiceButton.classList.add('processing');
        statusText.textContent = 'DISCONNECTING...';
        setTimeout(() => {
          voiceButton.classList.remove('processing');
          statusText.textContent = 'HOLD TO SPEAK';
        }, 500);
      }
    }

    voiceButton.addEventListener('mousedown', (e) => {
      e.preventDefault();
      if (!isProcessing) {
        isHolding = true;
        startRecording();
      }
    });

    voiceButton.addEventListener('mouseup', (e) => {
      e.preventDefault();
      if (isHolding) {
        isHolding = false;
        if (isTurbo) {
           stopTurboMode();
        } else {
           stopRecording();
        }
      }
    });

    voiceButton.addEventListener('mouseleave', (e) => {
      if (isHolding) {
        isHolding = false;
        stopRecording();
      }
    });

    // Touch events for mobile
    voiceButton.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (!isProcessing) {
        isHolding = true;
        startRecording();
      }
    }, { passive: false });

    voiceButton.addEventListener('touchend', (e) => {
      e.preventDefault();
      if (isHolding) {
        isHolding = false;
        if (isTurbo) {
          // No action needed for VAD
        } else {
          stopRecording();
        }
      }
    }, { passive: false });

    voiceButton.addEventListener('touchcancel', (e) => {
      if (isHolding) {
        isHolding = false;
        if (isTurbo) {
          stopTurboMode();
        } else {
          stopRecording();
        }
      }
    }, { passive: false });

    // Make status text clickable for tap-to-toggle mode
    statusText.addEventListener('click', () => {
      if (isProcessing) return;
      
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        stopRecording();
      } else {
        startRecording();
      }
    });
  </script>
</body>
</html>

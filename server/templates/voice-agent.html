<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Voice Booking - {{BUSINESS_NAME}}</title>
  <meta name="description" content="Book appointments with {{BUSINESS_NAME}} using our Informational Assistant">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    :root {
      --pure-black: #000000;
      --charcoal: #0a0a0a;
      --graphite: #141414;
      --smoke: #6b6b6b;
      --silver: #9e9e9e;
      --pearl: #f5f5f5;
      --pure-white: #ffffff;
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--pure-black);
      color: var(--pure-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      animation: fadeIn 1s ease;
    }

    .business-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px;
      font-weight: 500;
      letter-spacing: -0.5px;
      color: var(--pearl);
      margin-bottom: 8px;
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 72px;
      font-weight: 700;
      letter-spacing: -3px;
      line-height: 0.9;
      margin-bottom: 24px;
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
    }

    .subtitle {
      font-size: 18px;
      color: var(--smoke);
      font-weight: 400;
      letter-spacing: 0.5px;
      margin-bottom: 48px;
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border-radius: 32px;
      padding: 40px 32px;
      border: 1px solid var(--glass-border);
      width: 100%;
      margin-bottom: 48px;
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
    }

    .maintenance-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 16px;
      letter-spacing: -0.5px;
    }

    .voice-button-container {
      position: relative;
      margin-bottom: 32px;
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
    }

    .voice-button {
      width: 120px;
      height: 120px;
      border-radius: 60px;
      border: none;
      background: var(--pure-white);
      color: var(--pure-black);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 60px rgba(255,255,255,0.15);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .status-text {
      font-size: 12px;
      font-weight: 500;
      color: var(--smoke);
      text-transform: uppercase;
      letter-spacing: 4px;
      margin-bottom: 48px;
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both;
    }

    .footer-links {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s both;
    }

    .btn {
      width: 100%;
      padding: 20px;
      background: var(--pure-white);
      color: var(--pure-black);
      border: none;
      border-radius: 20px;
      font-size: 17px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--pure-white);
    }

    .mic-icon {
      width: 40px;
      height: 40px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="business-name">{{BUSINESS_NAME}}</div>
    
    <h1 class="title">VOICE<br>ASSISTANT</h1>
    <p class="subtitle">Informational Assistant</p>
    
    <div class="glass-card">
      <h2 class="maintenance-title">Maintenance</h2>
      <p style="color: var(--silver); font-weight: 300; line-height: 1.6;">
        The Voice Assistant is currently undergoing maintenance and will be available soon. Please use our text-based booking flow in the meantime.
      </p>
    </div>

    <div class="voice-button-container" style="opacity: 0.2; pointer-events: none;">
      <button class="voice-button" id="voiceButton" aria-label="Start voice recording">
        <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" x2="12" y1="19" y2="22"/>
        </svg>
      </button>
    </div>

    <div class="status-text" id="statusText">READY TO START</div>

    <div class="error-message" id="errorMessage"></div>

    <div class="transcript-area" id="transcriptArea" style="display: none;"></div>

    <div class="footer-links">
      <a href="/book/{{BUSINESS_SLUG}}" class="btn">Text Booking</a>
      <a href="https://apps.apple.com/app/bookflowx/id6756943439" class="btn btn-secondary">Get the App</a>
    </div>

    <div class="powered-by" style="margin-top: 48px; opacity: 0.3;">
      Powered by <a href="https://confirmbooking.online" style="color: inherit; text-decoration: underline;">BookFlow</a>
    </div>
  </div>

  <script>
    const businessSlug = '{{BUSINESS_SLUG}}';
    const isTurbo = '{{IS_TURBO}}' === 'true';
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    const voiceButton = document.getElementById('voiceButton');
    const statusText = document.getElementById('statusText');
    const transcriptArea = document.getElementById('transcriptArea');
    const errorMessage = document.getElementById('errorMessage');

    let mediaRecorder = null;
    let audioChunks = [];
    let conversationHistory = [];
    let isProcessing = false;
    let currentAudio = null;

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.add('visible');
      setTimeout(() => {
        errorMessage.classList.remove('visible');
      }, 5000);
    }

    function addTranscript(role, text) {
      if (!text) return;
      transcriptArea.style.display = 'block';
      const line = document.createElement('div');
      line.className = `transcript-line ${role}`;
      line.textContent = text;
      transcriptArea.appendChild(line);
      transcriptArea.scrollTop = transcriptArea.scrollHeight;
    }

    async function startRecording() {
      if (isProcessing) return;
      
      if (isTurbo) {
        if (isIOS) {
          showError("Turbo Mode is currently unavailable on iOS TestFlight. Switching to Standard.");
          setTimeout(() => {
            window.location.href = `/voice/${businessSlug}?turbo=false`;
          }, 2000);
          return;
        }
        startTurboMode();
        return;
      }

      // Stop any playing audio
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
      
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
            sampleRate: 16000,
          }
        });
        
        // Choose best available format
        const mimeType = isIOS 
          ? 'audio/wav' 
          : MediaRecorder.isTypeSupported('audio/webm;codecs=opus') 
            ? 'audio/webm;codecs=opus' 
            : MediaRecorder.isTypeSupported('audio/webm') 
              ? 'audio/webm' 
              : MediaRecorder.isTypeSupported('audio/mp4')
                ? 'audio/mp4'
                : '';

        const options = mimeType ? { mimeType } : {};
        mediaRecorder = new MediaRecorder(stream, options);
        audioChunks = [];

        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) {
            audioChunks.push(event.data);
          }
        };

        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach(track => track.stop());
          
          if (audioChunks.length === 0) {
            showError('No audio recorded. Please try again.');
            statusText.textContent = 'HOLD TO SPEAK';
            return;
          }
          
          const audioBlob = new Blob(audioChunks, { type: mimeType || 'audio/webm' });
          console.log(`[VoiceAgent] Recorded ${audioBlob.size} bytes of audio`);
          
          if (audioBlob.size < 1000) {
            showError('Recording too short. Please hold longer and speak clearly.');
            statusText.textContent = 'HOLD TO SPEAK';
            return;
          }
          
          await sendAudio(audioBlob);
        };

        mediaRecorder.start(100); // Collect data every 100ms
        voiceButton.classList.add('recording');
        statusText.textContent = 'LISTENING...';
      } catch (error) {
        console.error('Recording error:', error);
        showError('Please allow microphone access to use voice booking.');
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        voiceButton.classList.remove('recording');
        voiceButton.classList.add('processing');
        statusText.textContent = 'PROCESSING...';
      }
    }

    // Turbo Mode (Realtime WebRTC) Implementation
    let pc = null;
    let dataChannel = null;

    async function startTurboMode() {
      if (pc) return;
      
      statusText.textContent = 'CONNECTING TURBO...';
      voiceButton.classList.add('processing');

      try {
        const tokenRes = await fetch(`/api/voice/${businessSlug}/token`);
        const { client_secret } = await tokenRes.json();

        pc = new RTCPeerConnection();
        
        const audioEl = document.createElement("audio");
        audioEl.autoplay = true;
        pc.ontrack = e => audioEl.srcObject = e.streams[0];

        const ms = await navigator.mediaDevices.getUserMedia({ audio: true });
        pc.addTrack(ms.getTracks()[0]);

        dataChannel = pc.createDataChannel("oai-events");
        dataChannel.addEventListener("open", () => {
          statusText.textContent = 'TURBO ACTIVE';
          voiceButton.classList.remove('processing');
          voiceButton.classList.add('recording');
          
          // Configure the session
          dataChannel.send(JSON.stringify({
            type: "session.update",
            session: {
              instructions: `You are a booking assistant for ${document.querySelector('.business-name').textContent}. Be concise and helpful.`,
              voice: "verse",
              input_audio_format: "pcm16",
              output_audio_format: "pcm16",
              turn_detection: { type: "server_vad" }
            }
          }));
        });

        dataChannel.addEventListener("message", (e) => {
          const serverEvent = JSON.parse(e.data);
          if (serverEvent.type === "response.audio_transcript.done") {
            addTranscript('assistant', serverEvent.transcript);
          }
          if (serverEvent.type === "conversation.item.input_audio_transcription.completed") {
            addTranscript('user', serverEvent.transcript);
          }
        });

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        const baseUrl = "https://api.openai.com/v1/realtime";
        const model = "gpt-4o-realtime-preview-2024-12-17";
        const sdpRes = await fetch(`${baseUrl}?model=${model}`, {
          method: "POST",
          body: offer.sdp,
          headers: {
            Authorization: `Bearer ${client_secret.value}`,
            "Content-Type": "application/sdp"
          }
        });

        const answer = { type: "answer", sdp: await sdpRes.text() };
        await pc.setRemoteDescription(answer);

      } catch (err) {
        console.error("Turbo Mode Error:", err);
        showError("Turbo Mode failed to start.");
        statusText.textContent = 'HOLD TO SPEAK';
        voiceButton.classList.remove('processing');
      }
    }

    function stopTurboMode() {
      if (pc) {
        pc.close();
        pc = null;
        dataChannel = null;
        voiceButton.classList.remove('recording');
        voiceButton.classList.add('processing');
        statusText.textContent = 'DISCONNECTING...';
        setTimeout(() => {
          voiceButton.classList.remove('processing');
          statusText.textContent = 'HOLD TO SPEAK';
        }, 500);
      }
    }

    voiceButton.addEventListener('mousedown', (e) => {
      e.preventDefault();
      if (!isProcessing) {
        isHolding = true;
        startRecording();
      }
    });

    voiceButton.addEventListener('mouseup', (e) => {
      e.preventDefault();
      if (isHolding) {
        isHolding = false;
        if (isTurbo) {
           stopTurboMode();
        } else {
           stopRecording();
        }
      }
    });

    voiceButton.addEventListener('mouseleave', (e) => {
      if (isHolding) {
        isHolding = false;
        stopRecording();
      }
    });

    // Touch events for mobile
    voiceButton.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (!isProcessing) {
        isHolding = true;
        startRecording();
      }
    }, { passive: false });

    voiceButton.addEventListener('touchend', (e) => {
      e.preventDefault();
      if (isHolding) {
        isHolding = false;
        if (isTurbo) {
          // No action needed for VAD
        } else {
          stopRecording();
        }
      }
    }, { passive: false });

    voiceButton.addEventListener('touchcancel', (e) => {
      if (isHolding) {
        isHolding = false;
        if (isTurbo) {
          stopTurboMode();
        } else {
          stopRecording();
        }
      }
    }, { passive: false });

    // Make status text clickable for tap-to-toggle mode
    statusText.addEventListener('click', () => {
      if (isProcessing) return;
      
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        stopRecording();
      } else {
        startRecording();
      }
    });
  </script>
</body>
</html>

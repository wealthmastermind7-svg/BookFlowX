<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Voice Booking - {{BUSINESS_NAME}}</title>
  <meta name="description" content="Book appointments with {{BUSINESS_NAME}} using our AI voice assistant">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --pure-black: #000000;
      --charcoal: #1a1a1a;
      --graphite: #2d2d2d;
      --smoke: #404040;
      --silver: #808080;
      --pearl: #f5f5f5;
      --pure-white: #ffffff;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--pure-black);
      color: var(--pure-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 40px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    .business-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: var(--pearl);
    }

    .title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -2px;
      line-height: 1.1;
    }

    .subtitle {
      font-size: 16px;
      color: var(--silver);
      font-weight: 300;
      max-width: 320px;
      line-height: 1.6;
    }

    .voice-button-container {
      position: relative;
      margin: 24px 0;
    }

    .pulse-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.1);
      animation: pulse 2s ease-out infinite;
      pointer-events: none;
    }

    .pulse-ring:nth-child(2) {
      animation-delay: 0.5s;
    }

    .pulse-ring:nth-child(3) {
      animation-delay: 1s;
    }

    @keyframes pulse {
      0% {
        transform: translate(-50%, -50%) scale(0.8);
        opacity: 1;
      }
      100% {
        transform: translate(-50%, -50%) scale(1.5);
        opacity: 0;
      }
    }

    .voice-button {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--graphite), var(--charcoal));
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 
        0 4px 24px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .voice-button:hover {
      transform: scale(1.05);
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    .voice-button:active {
      transform: scale(0.98);
    }

    .voice-button.recording {
      background: linear-gradient(135deg, #dc2626, #991b1b);
      animation: glow 1.5s ease-in-out infinite alternate;
    }

    .voice-button.recording .pulse-ring {
      border-color: rgba(220, 38, 38, 0.3);
    }

    @keyframes glow {
      from {
        box-shadow: 
          0 4px 24px rgba(220, 38, 38, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
      }
      to {
        box-shadow: 
          0 8px 48px rgba(220, 38, 38, 0.6),
          inset 0 1px 0 rgba(255, 255, 255, 0.15);
      }
    }

    .voice-button.processing {
      background: linear-gradient(135deg, var(--smoke), var(--graphite));
    }

    .mic-icon {
      width: 48px;
      height: 48px;
      color: var(--pure-white);
      transition: transform 0.3s ease;
    }

    .voice-button.recording .mic-icon {
      transform: scale(1.1);
    }

    .status-text {
      font-size: 14px;
      color: var(--silver);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 2px;
      min-height: 20px;
    }

    .transcript-area {
      width: 100%;
      max-height: 200px;
      overflow-y: auto;
      padding: 16px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .transcript-line {
      font-size: 14px;
      line-height: 1.6;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .transcript-line:last-child {
      border-bottom: none;
    }

    .transcript-line.user {
      color: var(--silver);
    }

    .transcript-line.user::before {
      content: "You: ";
      color: var(--smoke);
    }

    .transcript-line.assistant {
      color: var(--pearl);
    }

    .transcript-line.assistant::before {
      content: "Agent: ";
      color: var(--smoke);
    }

    .footer-links {
      display: flex;
      gap: 24px;
      margin-top: 16px;
    }

    .footer-link {
      color: var(--silver);
      text-decoration: none;
      font-size: 13px;
      font-weight: 400;
      transition: color 0.2s ease;
    }

    .footer-link:hover {
      color: var(--pearl);
    }

    .powered-by {
      font-size: 12px;
      color: var(--smoke);
      margin-top: 8px;
    }

    .powered-by a {
      color: var(--silver);
      text-decoration: none;
    }

    .error-message {
      background: rgba(220, 38, 38, 0.1);
      border: 1px solid rgba(220, 38, 38, 0.3);
      color: #fca5a5;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }

    .error-message.visible {
      display: block;
    }

    @media (max-width: 480px) {
      .title {
        font-size: 36px;
      }
      .voice-button {
        width: 140px;
        height: 140px;
      }
      .mic-icon {
        width: 40px;
        height: 40px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="business-name">{{BUSINESS_NAME}}</div>
    
    <h1 class="title">VOICE<br>BOOKING</h1>
    
    <p class="subtitle">
      Tap the microphone and speak naturally to book an appointment or ask questions.
    </p>

    <div class="voice-button-container">
      <div class="pulse-ring"></div>
      <div class="pulse-ring"></div>
      <div class="pulse-ring"></div>
      <button class="voice-button" id="voiceButton" aria-label="Start voice recording">
        <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" x2="12" y1="19" y2="22"/>
        </svg>
      </button>
    </div>

    <div class="status-text" id="statusText">TAP TO START</div>

    <div class="error-message" id="errorMessage"></div>

    <div class="transcript-area" id="transcriptArea" style="display: none;"></div>

    <div class="footer-links">
      <a href="/book/{{BUSINESS_SLUG}}" class="footer-link">Text Booking</a>
      <a href="https://apps.apple.com/app/bookflowx/id6746200938" class="footer-link">Get the App</a>
    </div>

    <div class="powered-by">
      Powered by <a href="https://confirmbooking.online">BookFlow</a>
    </div>
  </div>

  <script>
    const businessSlug = '{{BUSINESS_SLUG}}';
    const voiceButton = document.getElementById('voiceButton');
    const statusText = document.getElementById('statusText');
    const transcriptArea = document.getElementById('transcriptArea');
    const errorMessage = document.getElementById('errorMessage');

    let mediaRecorder = null;
    let audioChunks = [];
    let conversationHistory = [];
    let isProcessing = false;
    let audioContext = null;
    let audioQueue = [];
    let isPlaying = false;

    async function initAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)({
          sampleRate: 24000
        });
      }
      if (audioContext.state === 'suspended') {
        await audioContext.resume();
      }
    }

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.add('visible');
      setTimeout(() => {
        errorMessage.classList.remove('visible');
      }, 5000);
    }

    function addTranscript(role, text) {
      transcriptArea.style.display = 'block';
      const line = document.createElement('div');
      line.className = `transcript-line ${role}`;
      line.textContent = text;
      transcriptArea.appendChild(line);
      transcriptArea.scrollTop = transcriptArea.scrollHeight;
    }

    async function startRecording() {
      try {
        await initAudio();
        
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
        audioChunks = [];

        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) {
            audioChunks.push(event.data);
          }
        };

        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach(track => track.stop());
          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          await sendAudio(audioBlob);
        };

        mediaRecorder.start();
        voiceButton.classList.add('recording');
        statusText.textContent = 'LISTENING...';
      } catch (error) {
        console.error('Recording error:', error);
        showError('Please allow microphone access to use voice booking.');
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        voiceButton.classList.remove('recording');
        voiceButton.classList.add('processing');
        statusText.textContent = 'PROCESSING...';
      }
    }

    async function sendAudio(audioBlob) {
      isProcessing = true;
      
      try {
        const reader = new FileReader();
        reader.readAsDataURL(audioBlob);
        
        reader.onloadend = async () => {
          const base64Audio = reader.result.split(',')[1];
          
          const response = await fetch(`/api/voice/${businessSlug}/message`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              audio: base64Audio,
              inputFormat: 'webm',
              conversationHistory
            })
          });

          if (!response.ok) {
            throw new Error('Failed to process voice message');
          }

          const eventSource = response.body.getReader();
          const decoder = new TextDecoder();
          let assistantText = '';

          statusText.textContent = 'RESPONDING...';

          while (true) {
            const { done, value } = await eventSource.read();
            if (done) break;

            const text = decoder.decode(value);
            const lines = text.split('\n').filter(line => line.startsWith('data: '));

            for (const line of lines) {
              try {
                const event = JSON.parse(line.slice(6));
                
                if (event.type === 'user_transcript') {
                  addTranscript('user', event.data);
                  conversationHistory.push({ role: 'user', content: event.data });
                }
                
                if (event.type === 'transcript') {
                  assistantText += event.data;
                }
                
                if (event.type === 'audio') {
                  playAudioChunk(event.data);
                }
                
                if (event.type === 'done') {
                  addTranscript('assistant', event.data || assistantText);
                  conversationHistory.push({ role: 'assistant', content: event.data || assistantText });
                }
                
                if (event.type === 'error') {
                  showError(event.data);
                }
              } catch (e) {
                console.warn('Parse error:', e);
              }
            }
          }
        };
      } catch (error) {
        console.error('Send error:', error);
        showError('Failed to process your message. Please try again.');
      } finally {
        isProcessing = false;
        voiceButton.classList.remove('processing');
        statusText.textContent = 'TAP TO SPEAK';
      }
    }

    function playAudioChunk(base64Data) {
      const audioData = atob(base64Data);
      const audioBytes = new Uint8Array(audioData.length);
      for (let i = 0; i < audioData.length; i++) {
        audioBytes[i] = audioData.charCodeAt(i);
      }

      const int16Array = new Int16Array(audioBytes.buffer);
      const float32Array = new Float32Array(int16Array.length);
      for (let i = 0; i < int16Array.length; i++) {
        float32Array[i] = int16Array[i] / 32768.0;
      }

      audioQueue.push(float32Array);
      
      if (!isPlaying) {
        playNextChunk();
      }
    }

    async function playNextChunk() {
      if (audioQueue.length === 0) {
        isPlaying = false;
        return;
      }

      isPlaying = true;
      const float32Array = audioQueue.shift();

      const buffer = audioContext.createBuffer(1, float32Array.length, 24000);
      buffer.getChannelData(0).set(float32Array);

      const source = audioContext.createBufferSource();
      source.buffer = buffer;
      source.connect(audioContext.destination);
      source.onended = () => playNextChunk();
      source.start();
    }

    voiceButton.addEventListener('click', async () => {
      if (isProcessing) return;
      await initAudio();

      if (mediaRecorder && mediaRecorder.state === 'recording') {
        stopRecording();
      } else {
        startRecording();
      }
    });

    // Handle touch separately but with same logic for better mobile responsiveness
    let touchStartTime = 0;
    voiceButton.addEventListener('touchstart', async (e) => {
      e.preventDefault();
      if (isProcessing) return;
      touchStartTime = Date.now();
      await initAudio();
      startRecording();
    }, { passive: false });

    voiceButton.addEventListener('touchend', (e) => {
      e.preventDefault();
      const duration = Date.now() - touchStartTime;
      // If it was a very short tap, we handle it via click or just keep recording
      // For now, we follow "Tap to start, Tap to stop" or "Hold to speak"
      // Let's implement robust "Hold to speak" but allow "Tap" toggle too
      if (duration > 300) {
        stopRecording();
      }
    }, { passive: false });
  </script>
</body>
</html>

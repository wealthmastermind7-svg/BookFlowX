<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Appointment</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    :root {
      --black: #000000;
      --charcoal: #1a1a1a;
      --graphite: #2d2d2d;
      --smoke: #6b6b6b;
      --silver: #9e9e9e;
      --pearl: #f5f5f5;
      --white: #ffffff;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--white);
      color: var(--black);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px;
      min-height: 100vh;
      position: relative;
    }
    .bg-text {
      position: fixed;
      font-size: 150px;
      font-weight: 200;
      color: var(--black);
      opacity: 0.03;
      z-index: -1;
      white-space: nowrap;
      pointer-events: none;
      text-transform: uppercase;
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
    }
    .header {
      text-align: left;
      margin-bottom: 48px;
      padding-top: 40px;
    }
    .header h1 {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -1.5px;
      margin-bottom: 4px;
    }
    .header p {
      color: var(--smoke);
      font-size: 18px;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 24px;
      border: 1px solid rgba(0, 0, 0, 0.05);
      margin-bottom: 16px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }
    .glass-card:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.85);
      border-color: rgba(0, 0, 0, 0.1);
    }
    .glass-card.selected {
      border-color: var(--black);
      border-width: 2px;
    }
    .service-name { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .service-meta { display: flex; align-items: baseline; gap: 12px; }
    .service-duration { font-size: 18px; color: var(--smoke); font-weight: 300; }
    .service-price { font-size: 28px; font-weight: 200; color: var(--black); }
    .service-desc { font-size: 16px; color: var(--smoke); margin-top: 12px; line-height: 1.5; }

    .time-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .time-slot {
      padding: 16px;
      border-radius: 16px;
      text-align: center;
      background: rgba(0, 0, 0, 0.03);
      border: 1px solid transparent;
      font-weight: 500;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .time-slot.selected {
      background: var(--black);
      color: var(--white);
    }
    .time-slot.unavailable { opacity: 0.3; cursor: not-allowed; text-decoration: line-through; }

    .input-group { margin-bottom: 24px; }
    .input-group label { display: block; font-size: 14px; font-weight: 600; color: var(--smoke); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
    .input-group input {
      width: 100%;
      padding: 18px;
      background: rgba(0, 0, 0, 0.04);
      border: none;
      border-radius: 16px;
      font-size: 18px;
      outline: none;
      transition: background 0.2s ease;
    }
    .input-group input:focus { background: rgba(0, 0, 0, 0.06); }

    .btn {
      width: 100%;
      padding: 20px;
      background: var(--black);
      color: var(--white);
      border: none;
      border-radius: 20px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 12px;
    }
    .btn:disabled { background: var(--silver); cursor: not-allowed; transform: none !important; }
    .btn:active { transform: scale(0.98); }
    .btn-secondary { background: transparent; border: 1px solid var(--pearl); color: var(--black); }

    .screen { display: none; animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
    .screen.active { display: block; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

    .confirmation-hero { text-align: center; padding: 40px 0; }
    .checkmark-ring {
      width: 80px;
      height: 80px;
      border-radius: 40px;
      background: var(--black);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    }
    .checkmark-ring svg { width: 40px; height: 40px; color: var(--white); }

    .summary-item { display: flex; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid rgba(0,0,0,0.05); }
    .summary-item:last-child { border: none; font-weight: 700; font-size: 20px; padding-top: 24px; }
    .summary-label { color: var(--smoke); }

    #date-input { margin-bottom: 24px; width: 100%; }
    .loading-overlay { position: fixed; inset: 0; background: var(--white); display: flex; align-items: center; justify-content: center; z-index: 100; }
  </style>
</head>
<body>
  <div id="loading" class="loading-overlay">
    <div style="font-weight: 200; font-size: 24px; letter-spacing: 4px;">BOOKFLOW</div>
  </div>

  <div class="container" id="app" style="display: none;">
    <div id="bg-text" class="bg-text">SERVICE</div>
    
    <div class="header">
      <h1 id="business-name">Business</h1>
      <p id="business-tagline">Premium Booking</p>
    </div>

    <!-- Screen 1: Services -->
    <div id="screen-1" class="screen active">
      <div id="services-list"></div>
    </div>

    <!-- Screen 2: Time -->
    <div id="screen-2" class="screen">
      <div class="glass-card">
        <label style="display: block; font-size: 14px; font-weight: 600; color: var(--smoke); margin-bottom: 12px;">SELECT DATE</label>
        <input type="date" id="date-input" class="input-group input">
        <div id="slots-container">
          <label style="display: block; font-size: 14px; font-weight: 600; color: var(--smoke); margin-bottom: 12px;">AVAILABLE TIMES</label>
          <div class="time-grid" id="time-slots"></div>
        </div>
      </div>
      <button class="btn" id="btn-to-checkout" disabled>Continue</button>
      <button class="btn btn-secondary" id="btn-back-1">Back</button>
    </div>

    <!-- Screen 3: Details -->
    <div id="screen-3" class="screen">
      <div class="glass-card">
        <div class="input-group">
          <label>Full Name</label>
          <input type="text" id="customer-name" placeholder="John Smith">
        </div>
        <div class="input-group">
          <label>Email Address</label>
          <input type="email" id="customer-email" placeholder="john@example.com">
        </div>
        <div class="input-group">
          <label>Phone Number</label>
          <input type="tel" id="customer-phone" placeholder="(555) 123-4567">
        </div>
      </div>
      
      <div class="glass-card">
        <div class="summary-item"><span class="summary-label">Service</span><span id="summary-service">-</span></div>
        <div class="summary-item"><span class="summary-label">Date & Time</span><span id="summary-datetime">-</span></div>
        <div class="summary-item"><span class="summary-label">Total Amount</span><span id="summary-total">$0.00</span></div>
      </div>
      
      <button class="btn" id="btn-confirm">Confirm Booking</button>
      <button class="btn btn-secondary" id="btn-back-2">Back</button>
    </div>

    <!-- Screen 4: Confirmation -->
    <div id="screen-4" class="screen">
      <div class="confirmation-hero">
        <div class="checkmark-ring">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <h2 style="font-size: 32px; font-weight: 700; margin-bottom: 8px;">Confirmed</h2>
        <p style="color: var(--smoke); font-size: 18px;">Check your email for details</p>
      </div>
      
      <div class="glass-card">
        <div class="summary-item"><span class="summary-label">Booking ID</span><span id="confirm-id">-</span></div>
        <div class="summary-item"><span class="summary-label">Service</span><span id="confirm-service">-</span></div>
        <div class="summary-item"><span class="summary-label">Time</span><span id="confirm-datetime">-</span></div>
      </div>
      
      <button class="btn" id="btn-new-booking">Book Another</button>
    </div>
  </div>

  <script>
    let business = null;
    let services = [];
    let selectedService = null;
    let selectedDate = new Date().toISOString().split('T')[0];
    let selectedTime = null;

    const bgText = document.getElementById('bg-text');
    const pathParts = window.location.pathname.split('/');
    const businessSlug = pathParts[pathParts.indexOf('book') + 1];

    async function init() {
      try {
        const res = await fetch(`/api/businesses/${businessSlug}`);
        if (!res.ok) throw new Error('Not found');
        business = await res.json();
        document.getElementById('business-name').textContent = business.name;
        
        const servicesRes = await fetch(`/api/businesses/${business.id}/services`);
        services = await servicesRes.json();
        renderServices();
        
        document.getElementById('date-input').min = selectedDate;
        document.getElementById('date-input').value = selectedDate;
        
        document.getElementById('loading').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        setupListeners();
      } catch (e) {
        document.getElementById('loading').innerHTML = 'Business Not Found';
      }
    }

    function renderServices() {
      const list = document.getElementById('services-list');
      list.innerHTML = services.map(s => `
        <div class="glass-card" onclick="selectService('${s.id}')">
          <div class="service-name">${s.name}</div>
          <div class="service-meta">
            <div class="service-price">$${(s.price / 100).toFixed(2)}</div>
            <div class="service-duration">${s.duration} min</div>
          </div>
          ${s.description ? `<div class="service-desc">${s.description}</div>` : ''}
        </div>
      `).join('');
    }

    function selectService(id) {
      selectedService = services.find(s => s.id === id);
      bgText.textContent = 'DATE';
      goToStep(2);
      loadSlots();
    }

    async function loadSlots() {
      const container = document.getElementById('time-slots');
      container.innerHTML = 'Loading...';
      const res = await fetch(`/api/businesses/${business.id}/slots/${selectedDate}?serviceId=${selectedService.id}`);
      const data = await res.json();
      
      container.innerHTML = data.slots.map(s => `
        <div class="time-slot ${s.available ? '' : 'unavailable'}" 
             onclick="${s.available ? `selectTime('${s.time}')` : ''}"
             id="slot-${s.time.replace(/[:\s]/g, '')}">
          ${s.time}
        </div>
      `).join('');
    }

    function selectTime(time) {
      selectedTime = time;
      document.querySelectorAll('.time-slot').forEach(el => el.classList.remove('selected'));
      document.getElementById(`slot-${time.replace(/[:\s]/g, '')}`).classList.add('selected');
      document.getElementById('btn-to-checkout').disabled = false;
    }

    function goToStep(step) {
      document.querySelectorAll('.screen').forEach((s, i) => s.classList.toggle('active', i + 1 === step));
      if (step === 1) bgText.textContent = 'SERVICE';
      if (step === 2) bgText.textContent = 'TIME';
      if (step === 3) {
        bgText.textContent = 'RESERVE';
        document.getElementById('summary-service').textContent = selectedService.name;
        document.getElementById('summary-datetime').textContent = `${selectedDate} at ${selectedTime}`;
        document.getElementById('summary-total').textContent = `$${(selectedService.price / 100).toFixed(2)}`;
      }
      if (step === 4) bgText.textContent = 'DONE';
    }

    async function confirmBooking() {
      const name = document.getElementById('customer-name').value;
      const email = document.getElementById('customer-email').value;
      if (!name || !email) return alert('Name and email required');

      const btn = document.getElementById('btn-confirm');
      btn.disabled = true;
      btn.textContent = 'Processing...';

      try {
        const custRes = await fetch(`/api/businesses/${business.id}/customers`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ name, email, phone: document.getElementById('customer-phone').value })
        });
        const customer = await custRes.json();

        const bookRes = await fetch(`/api/businesses/${business.id}/bookings`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            customerId: customer.id,
            serviceId: selectedService.id,
            date: selectedDate,
            time: selectedTime,
            status: 'confirmed',
            totalPrice: selectedService.price
          })
        });
        const booking = await bookRes.json();

        document.getElementById('confirm-id').textContent = booking.id.substring(0,8).toUpperCase();
        document.getElementById('confirm-service').textContent = selectedService.name;
        document.getElementById('confirm-datetime').textContent = `${selectedDate} ${selectedTime}`;
        goToStep(4);
      } catch (e) {
        alert('Booking failed');
        btn.disabled = false;
        btn.textContent = 'Confirm Booking';
      }
    }

    function setupListeners() {
      document.getElementById('date-input').onchange = (e) => {
        selectedDate = e.target.value;
        loadSlots();
      };
      document.getElementById('btn-back-1').onclick = () => goToStep(1);
      document.getElementById('btn-to-checkout').onclick = () => goToStep(3);
      document.getElementById('btn-back-2').onclick = () => goToStep(2);
      document.getElementById('btn-confirm').onclick = confirmBooking;
      document.getElementById('btn-new-booking').onclick = () => window.location.reload();
    }

    init();
  </script>
</body>
</html>

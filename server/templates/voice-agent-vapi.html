<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Voice Booking - {{BUSINESS_NAME}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --pure-black: #000000;
      --charcoal: #1a1a1a;
      --graphite: #2d2d2d;
      --smoke: #404040;
      --silver: #808080;
      --pearl: #f5f5f5;
      --pure-white: #ffffff;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--pure-black);
      color: var(--pure-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .container {
      width: 100%;
      max-width: 480px;
      padding: 40px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }
    .business-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 600;
      color: var(--pearl);
    }
    .title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -2px;
      line-height: 1.1;
    }
    .subtitle {
      font-size: 16px;
      color: var(--silver);
      font-weight: 300;
      max-width: 320px;
      line-height: 1.6;
    }
    .voice-button-container {
      position: relative;
      margin: 24px 0;
    }
    .pulse-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.1);
      animation: pulse 2s ease-out infinite;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .pulse-ring.active { opacity: 1; }
    @keyframes pulse {
      0% { transform: translate(-50%, -50%) scale(0.8); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
    }
    .voice-button {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--graphite), var(--charcoal));
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
    }
    .voice-button.active {
      background: linear-gradient(135deg, var(--pure-white), var(--pearl));
      box-shadow: 0 8px 48px rgba(255, 255, 255, 0.5);
    }
    .mic-icon {
      width: 48px;
      height: 48px;
      color: var(--pure-white);
    }
    .voice-button.active .mic-icon { color: var(--pure-black); }
    .status-text {
      font-size: 14px;
      color: var(--silver);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .error-message {
      background: rgba(220, 38, 38, 0.1);
      border: 1px solid rgba(220, 38, 38, 0.3);
      color: #fca5a5;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    .error-message.visible { display: block; }
    .footer-links { display: flex; gap: 24px; margin-top: 16px; }
    .footer-link { color: var(--silver); text-decoration: none; font-size: 13px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="business-name">{{BUSINESS_NAME}}</div>
    <h1 class="title">VOICE<br>BOOKING</h1>
    <p class="subtitle">Tap to start a conversation with our AI receptionist.</p>
    <div class="voice-button-container">
      <div class="pulse-ring" id="pulseRing"></div>
      <button class="voice-button" id="voiceButton">
        <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" x2="12" y1="19" y2="22"/>
        </svg>
      </button>
    </div>
    <div class="status-text" id="statusText">TAP TO START</div>
    <div class="error-message" id="errorMessage"></div>
    <div class="footer-links">
      <a href="/book/{{BUSINESS_SLUG}}" class="footer-link">Text Booking</a>
      <a href="https://apps.apple.com/app/bookflowx/id6756943439" class="footer-link">Get the App</a>
    </div>
  </div>

  <!-- Reverting to a known stable SDK script delivery -->
  <script src="https://unpkg.com/@vapi-ai/web@latest/dist/vapi.js"></script>
  <script>
    const businessSlug = '{{BUSINESS_SLUG}}';
    const vapiAssistantId = '{{VAPI_ASSISTANT_ID}}';
    const vapiPublicKey = '{{VAPI_PUBLIC_KEY}}';
    
    const voiceButton = document.getElementById('voiceButton');
    const statusText = document.getElementById('statusText');
    const errorMessage = document.getElementById('errorMessage');
    const pulseRing = document.getElementById('pulseRing');

    let vapi = null;
    let isActive = false;

    function showError(msg) {
      errorMessage.textContent = msg;
      errorMessage.classList.add('visible');
      setTimeout(() => errorMessage.classList.remove('visible'), 5000);
    }

    function init() {
      try {
        // Vapi v2+ exposes 'Vapi' globally from the dist bundle
        const VapiClass = window.Vapi;
        
        if (!VapiClass) {
          console.warn('[Vapi] SDK not found on window. Retrying...');
          setTimeout(init, 500);
          return;
        }

        vapi = new VapiClass(vapiPublicKey);
        console.log('[Vapi] Initialized');

        vapi.on('call-start', () => {
          isActive = true;
          voiceButton.classList.add('active');
          pulseRing.classList.add('active');
          statusText.textContent = 'LISTENING...';
        });

        vapi.on('call-end', () => {
          isActive = false;
          voiceButton.classList.remove('active');
          pulseRing.classList.remove('active');
          statusText.textContent = 'TAP TO START';
        });

        vapi.on('error', (e) => {
          console.error('[Vapi] Error:', e);
          showError('Voice agent error. Please try again.');
          isActive = false;
          voiceButton.classList.remove('active');
          pulseRing.classList.remove('active');
          statusText.textContent = 'TAP TO START';
        });
      } catch (e) {
        console.error('[Vapi] Init Exception:', e);
      }
    }

    voiceButton.addEventListener('click', async () => {
      if (!vapi) {
        init();
        if (!vapi) return;
      }

      if (isActive) {
        vapi.stop();
      } else {
        statusText.textContent = 'CONNECTING...';
        try {
          await vapi.start(vapiAssistantId, { 
            metadata: { businessSlug: businessSlug } 
          });
        } catch (e) {
          console.error('[Vapi] Start Failed:', e);
          showError('Microphone access is required.');
          statusText.textContent = 'TAP TO START';
        }
      }
    });

    // Start initialization when script loads
    if (document.readyState === 'complete') {
      init();
    } else {
      window.addEventListener('load', init);
    }
  </script>
</body>
</html>

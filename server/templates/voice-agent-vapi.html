<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Voice Booking - {{BUSINESS_NAME}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --pure-black: #000000;
      --charcoal: #111111;
      --graphite: #222222;
      --smoke: #444444;
      --silver: #888888;
      --pearl: #DDDDDD;
      --pure-white: #ffffff;
      --vibrant-red: #D32F2F;
      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--pure-black);
      color: var(--pure-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      justify-content: center;
    }

    /* Premium Typography */
    .business-info {
      animation: fadeInDown 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      margin-bottom: 20px;
    }

    .business-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 500;
      color: var(--pure-white);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    .voice-booking-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 56px;
      font-weight: 500;
      color: var(--pure-white);
      letter-spacing: 4px;
      text-transform: uppercase;
      line-height: 1.1;
      margin-bottom: 40px;
    }

    .instruction-text {
      font-size: 18px;
      color: var(--silver);
      font-weight: 300;
      max-width: 300px;
      line-height: 1.6;
      margin: 0 auto;
    }

    /* Mic Button */
    .ai-visual-container {
      position: relative;
      width: 300px;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 40px auto;
    }

    .mic-outer-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(211, 47, 47, 0.1) 0%, transparent 70%);
      transition: all 0.5s ease;
    }

    .voice-btn {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: var(--vibrant-red);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      z-index: 10;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 0 40px rgba(211, 47, 47, 0.4);
    }

    .voice-btn:active {
      transform: scale(0.92);
    }

    .voice-btn svg {
      width: 64px;
      height: 64px;
      color: white;
      stroke-width: 2;
    }

    .listening-status {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 4px;
      color: var(--silver);
      text-transform: uppercase;
      margin-top: 20px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .listening-status.active {
      opacity: 1;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    .bottom-links {
      position: fixed;
      bottom: 40px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 32px;
    }

    .bottom-link {
      color: var(--silver);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .bottom-link:hover {
      color: white;
    }

    /* Animations */
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Sound Visualizer (Active) */
    .visualizer {
      display: none;
      align-items: center;
      gap: 4px;
      height: 20px;
    }

    .visualizer.active { display: flex; }

    .bar {
      width: 3px;
      height: 100%;
      background: white;
      border-radius: 10px;
      animation: equalize 0.8s ease-in-out infinite;
    }

    .bar:nth-child(2) { animation-delay: 0.1s; }
    .bar:nth-child(3) { animation-delay: 0.2s; }
    .bar:nth-child(4) { animation-delay: 0.3s; }
    .bar:nth-child(5) { animation-delay: 0.4s; }

    @keyframes equalize {
      0%, 100% { height: 4px; }
      50% { height: 20px; }
    }

    #errorMessage {
      position: fixed;
      top: calc(var(--safe-top) + 80px);
      left: 24px;
      right: 24px;
      background: rgba(220, 38, 38, 0.9);
      color: white;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 1000;
    }
    #errorMessage.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div id="errorMessage"></div>

  <main class="main-content">
    <div class="business-info">
      <h2 class="business-name">{{BUSINESS_NAME}}</h2>
      <h1 class="voice-booking-title">Voice<br>Booking</h1>
      <p class="instruction-text" id="instructionText">Tap the microphone and speak naturally to book an appointment or ask questions.</p>
    </div>

    <div class="ai-visual-container">
      <div class="mic-outer-ring" id="outerRing"></div>
      
      <button class="voice-btn" id="voiceButton">
        <svg id="micIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>
    </div>

    <div class="listening-status" id="listeningStatus">Listening...</div>
  </main>

  <div class="bottom-links">
    <a href="/book/{{BUSINESS_SLUG}}" class="bottom-link">Text Booking</a>
    <a href="https://testflight.apple.com/join/ryGJxpMF" class="bottom-link">Get the App</a>
  </div>

  <script>
    const businessSlug = '{{BUSINESS_SLUG}}';
    const vapiAssistantId = '{{VAPI_ASSISTANT_ID}}';
    const vapiPublicKey = '{{VAPI_PUBLIC_KEY}}';
    
    const voiceButton = document.getElementById('voiceButton');
    const instructionText = document.getElementById('instructionText');
    const listeningStatus = document.getElementById('listeningStatus');
    const errorMessage = document.getElementById('errorMessage');
    const outerRing = document.getElementById('outerRing');

    let vapiInstance = null;
    let isActive = false;
    let isConnecting = false;

    function showError(msg) {
      errorMessage.textContent = msg;
      errorMessage.classList.add('visible');
      setTimeout(() => errorMessage.classList.remove('visible'), 5000);
    }

    function updateUI(state) {
      switch(state) {
        case 'idle':
          isActive = false;
          isConnecting = false;
          voiceButton.classList.remove('active');
          listeningStatus.classList.remove('active');
          outerRing.style.boxShadow = 'none';
          break;
        case 'connecting':
          isConnecting = true;
          listeningStatus.textContent = 'Connecting...';
          listeningStatus.classList.add('active');
          break;
        case 'active':
          isActive = true;
          isConnecting = false;
          voiceButton.classList.add('active');
          listeningStatus.textContent = 'Listening...';
          listeningStatus.classList.add('active');
          outerRing.style.boxShadow = '0 0 100px rgba(211, 47, 47, 0.4)';
          break;
        case 'speaking':
          listeningStatus.textContent = 'AI is speaking...';
          listeningStatus.classList.add('active');
          break;
      }
    }

    // Load Vapi SDK
    (function(d, t) {
      var g = document.createElement(t);
      var s = d.getElementsByTagName(t)[0];
      g.src = "https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";
      g.defer = true;
      g.async = true;
      s.parentNode.insertBefore(g, s);

      g.onload = function() {
        if (!vapiPublicKey) {
          showError('Voice booking not configured.');
          return;
        }

        vapiInstance = window.vapiSDK.run({
          apiKey: vapiPublicKey,
          assistant: vapiAssistantId,
          config: { hide: true }
        });

        if (vapiInstance) {
          vapiInstance.on('call-start', () => updateUI('active'));
          vapiInstance.on('call-end', () => updateUI('idle'));
          vapiInstance.on('speech-start', () => updateUI('speaking'));
          vapiInstance.on('speech-end', () => isActive && updateUI('active'));
          vapiInstance.on('error', (err) => {
            console.error(err);
            showError('Connection error. Please try again.');
            updateUI('idle');
          });
        }
      };
    })(document, 'script');

    voiceButton.addEventListener('click', async () => {
      if (!vapiInstance) {
        showError('Service loading, please wait...');
        return;
      }

      if (isActive) {
        vapiInstance.stop();
        updateUI('idle');
      } else if (!isConnecting) {
        updateUI('connecting');
        try {
          await vapiInstance.start();
        } catch (err) {
          showError('Microphone access required.');
          updateUI('idle');
        }
      }
    });
  </script>
</body>
</html>

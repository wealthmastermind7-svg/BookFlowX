<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Voice Assistant - {{BUSINESS_NAME}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
    :root {
      --pure-black: #000000;
      --charcoal: #0a0a0a;
      --graphite: #141414;
      --smoke: #6b6b6b;
      --silver: #9e9e9e;
      --pearl: #f5f5f5;
      --pure-white: #ffffff;
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.15; }
      50% { transform: scale(1.08); opacity: 0.25; }
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--pure-black);
      color: var(--pure-white);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-top: calc(var(--safe-top) + 24px);
      padding-bottom: calc(var(--safe-bottom) + 24px);
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 1s ease;
    }

    .business-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px;
      font-weight: 500;
      letter-spacing: -0.5px;
      color: var(--pearl);
      margin-bottom: 8px;
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .page-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 72px;
      font-weight: 700;
      letter-spacing: -3px;
      line-height: 0.9;
      color: var(--pure-white);
      margin-bottom: 16px;
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
    }

    .tagline {
      font-size: 15px;
      color: var(--smoke);
      font-weight: 400;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 48px;
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
    }

    .mic-area {
      position: relative;
      width: 160px;
      height: 160px;
      margin-bottom: 24px;
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
    }

    .mic-glow {
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 70%);
      animation: breathe 4s ease-in-out infinite;
      pointer-events: none;
    }

    .voice-btn {
      width: 120px;
      height: 120px;
      border-radius: 60px;
      background: var(--pure-white);
      color: var(--pure-black);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 20px 60px rgba(255,255,255,0.12);
      z-index: 2;
    }

    .voice-btn:hover {
      transform: translate(-50%, -50%) scale(1.05);
      box-shadow: 0 24px 80px rgba(255,255,255,0.18);
    }

    .voice-btn:active {
      transform: translate(-50%, -50%) scale(0.95);
    }

    .voice-btn.active {
      background: var(--pure-white);
      box-shadow: 0 20px 60px rgba(255,255,255,0.2);
    }

    .voice-btn svg {
      width: 36px;
      height: 36px;
      color: var(--pure-black);
      stroke-width: 2;
    }

    .status-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--smoke);
      text-transform: uppercase;
      letter-spacing: 4px;
      margin-bottom: 48px;
      min-height: 16px;
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
    }

    .status-label.active {
      color: var(--pearl);
      animation: pulse 2s infinite;
    }

    .footer-links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both;
    }

    .btn-primary {
      width: 100%;
      display: block;
      padding: 18px;
      background: var(--pure-white);
      color: var(--pure-black);
      text-decoration: none;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-primary:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 32px rgba(255,255,255,0.1);
    }

    .btn-ghost {
      width: 100%;
      display: block;
      padding: 18px;
      background: transparent;
      color: var(--pure-white);
      text-decoration: none;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 500;
      border: 1px solid rgba(255,255,255,0.12);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-ghost:hover {
      background: rgba(255,255,255,0.04);
      border-color: rgba(255,255,255,0.2);
    }

    .powered {
      margin-top: 40px;
      font-size: 11px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 1px;
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s both;
    }
    .powered a { color: rgba(255,255,255,0.3); text-decoration: none; }

    #errorMessage {
      position: fixed;
      top: calc(var(--safe-top) + 24px);
      left: 24px;
      right: 24px;
      background: rgba(220, 38, 38, 0.9);
      backdrop-filter: blur(20px);
      color: white;
      padding: 14px 20px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      z-index: 1000;
    }
    #errorMessage.visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-height: 700px) {
      .page-title { font-size: 56px; }
      .tagline { margin-bottom: 32px; }
      .mic-area { width: 130px; height: 130px; margin-bottom: 16px; }
      .voice-btn { width: 100px; height: 100px; border-radius: 50px; }
    }
  </style>
</head>
<body>
  <div id="errorMessage"></div>

  <div class="container">
    <h2 class="business-name">{{BUSINESS_NAME}}</h2>
    <h1 class="page-title">VOICE<br>ASSISTANT</h1>
    <p class="tagline">Informational Assistant</p>

    <div class="mic-area">
      <div class="mic-glow" id="outerRing"></div>
      <button class="voice-btn" id="voiceButton">
        <svg id="micIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>
    </div>

    <div class="status-label" id="listeningStatus">TAP TO START</div>

    <div class="footer-links">
      <a href="/book/{{BUSINESS_SLUG}}" class="btn-primary">Text Booking</a>
      <a href="https://apps.apple.com/app/bookflowx/id6756943439" class="btn-ghost">Get the App</a>
    </div>

    <div class="powered">Powered by <a href="https://confirmbooking.online">BookFlow</a></div>
  </div>

  <script>
    const businessSlug = '{{BUSINESS_SLUG}}';
    const vapiAssistantId = '{{VAPI_ASSISTANT_ID}}';
    const vapiPublicKey = '{{VAPI_PUBLIC_KEY}}';
    
    const voiceButton = document.getElementById('voiceButton');
    const instructionText = document.getElementById('instructionText');
    const listeningStatus = document.getElementById('listeningStatus');
    const errorMessage = document.getElementById('errorMessage');
    const outerRing = document.getElementById('outerRing');

    let vapiInstance = null;
    let isActive = false;
    let isConnecting = false;

    function showError(msg) {
      errorMessage.textContent = msg;
      errorMessage.classList.add('visible');
      setTimeout(() => errorMessage.classList.remove('visible'), 5000);
    }

    function updateUI(state) {
      switch(state) {
        case 'idle':
          isActive = false;
          isConnecting = false;
          voiceButton.classList.remove('active');
          listeningStatus.classList.remove('active');
          listeningStatus.textContent = 'TAP TO START';
          break;
        case 'connecting':
          isConnecting = true;
          listeningStatus.textContent = 'CONNECTING...';
          listeningStatus.classList.add('active');
          break;
        case 'active':
          isActive = true;
          isConnecting = false;
          voiceButton.classList.add('active');
          listeningStatus.textContent = 'LISTENING...';
          listeningStatus.classList.add('active');
          break;
        case 'speaking':
          listeningStatus.textContent = 'SPEAKING...';
          listeningStatus.classList.add('active');
          break;
      }
    }

    (function(d, t) {
      var g = document.createElement(t);
      var s = d.getElementsByTagName(t)[0];
      g.src = "https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";
      g.defer = true;
      g.async = true;
      s.parentNode.insertBefore(g, s);

      g.onload = function() {
        if (!vapiPublicKey) {
          showError('Voice assistant not configured.');
          return;
        }

        vapiInstance = window.vapiSDK.run({
          apiKey: vapiPublicKey,
          assistant: vapiAssistantId,
          config: { hide: true }
        });

        if (vapiInstance) {
          vapiInstance.on('call-start', () => updateUI('active'));
          vapiInstance.on('call-end', () => updateUI('idle'));
          vapiInstance.on('speech-start', () => updateUI('speaking'));
          vapiInstance.on('speech-end', () => isActive && updateUI('active'));
          vapiInstance.on('error', (err) => {
            console.error(err);
            showError('Connection error. Please try again.');
            updateUI('idle');
          });
        }
      };
    })(document, 'script');

    voiceButton.addEventListener('click', async () => {
      if (!vapiInstance) {
        showError('Service loading, please wait...');
        return;
      }

      if (isActive) {
        vapiInstance.stop();
        updateUI('idle');
      } else if (!isConnecting) {
        updateUI('connecting');
        try {
          await vapiInstance.start();
        } catch (err) {
          showError('Microphone access required.');
          updateUI('idle');
        }
      }
    });
  </script>
</body>
</html>

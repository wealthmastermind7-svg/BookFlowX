<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Voice Booking - {{BUSINESS_NAME}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --pure-black: #000000;
      --charcoal: #1a1a1a;
      --graphite: #2d2d2d;
      --smoke: #404040;
      --silver: #808080;
      --pearl: #f5f5f5;
      --pure-white: #ffffff;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--pure-black);
      color: var(--pure-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .container {
      width: 100%;
      max-width: 480px;
      padding: 40px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }
    .business-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px;
      font-weight: 500;
      color: var(--pearl);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: -8px;
    }
    .title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 72px;
      font-weight: 400;
      letter-spacing: -3px;
      line-height: 0.9;
      color: var(--pure-white);
      margin-bottom: 8px;
    }
    .subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 18px;
      color: var(--silver);
      font-weight: 300;
      max-width: 340px;
      line-height: 1.6;
      letter-spacing: 0.5px;
    }
    .voice-button-container {
      position: relative;
      margin: 24px 0;
    }
    .pulse-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.1);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .pulse-ring.active {
      opacity: 1;
      animation: pulse 2s ease-out infinite;
    }
    @keyframes pulse {
      0% { transform: translate(-50%, -50%) scale(0.8); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
    }
    .voice-button {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: var(--charcoal);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
      transition: all 0.5s cubic-bezier(0.2, 1, 0.2, 1);
      box-shadow: 0 0 0 rgba(255, 255, 255, 0);
    }
    .voice-button:hover {
      transform: scale(1.05);
      border-color: rgba(255, 255, 255, 0.3);
    }
    .voice-button.active {
      background: var(--pure-white);
      transform: scale(1.1);
      box-shadow: 0 0 80px rgba(255, 255, 255, 0.3);
    }
    .voice-button.connecting {
      animation: pulse-button 1.5s ease-in-out infinite;
    }
    @keyframes pulse-button {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .mic-icon {
      width: 56px;
      height: 56px;
      color: var(--pure-white);
      transition: all 0.4s ease;
      stroke-width: 1.5;
    }
    .voice-button.active .mic-icon { color: var(--pure-black); }
    .status-text {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: var(--silver);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 4px;
      min-height: 20px;
      opacity: 0.6;
    }
    .error-message {
      background: rgba(220, 38, 38, 0.1);
      border: 1px solid rgba(220, 38, 38, 0.3);
      color: #fca5a5;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.3s ease;
      max-width: 300px;
    }
    .error-message.visible { opacity: 1; }
    .footer-links { display: flex; gap: 24px; margin-top: 16px; }
    .footer-link { color: var(--silver); text-decoration: none; font-size: 13px; transition: color 0.2s; }
    .footer-link:hover { color: var(--pearl); }
    /* Hide the default Vapi widget button */
    #vapi-widget-button { display: none !important; }
    .vapi-btn { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <div class="business-name">{{BUSINESS_NAME}}</div>
    <h1 class="title">VOICE<br>BOOKING</h1>
    <p class="subtitle">Tap to start a conversation with our AI receptionist.</p>
    <div class="voice-button-container">
      <div class="pulse-ring" id="pulseRing"></div>
      <button class="voice-button" id="voiceButton">
        <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" x2="12" y1="19" y2="22"/>
        </svg>
      </button>
    </div>
    <div class="status-text" id="statusText">TAP TO START</div>
    <div class="error-message" id="errorMessage"></div>
    <div class="footer-links">
      <a href="/book/{{BUSINESS_SLUG}}" class="footer-link">Text Booking</a>
      <a href="https://apps.apple.com/app/bookflowx/id6756943439" class="footer-link">Get the App</a>
    </div>
  </div>

  <script>
    const businessSlug = '{{BUSINESS_SLUG}}';
    const vapiAssistantId = '{{VAPI_ASSISTANT_ID}}';
    const vapiPublicKey = '{{VAPI_PUBLIC_KEY}}';
    
    const voiceButton = document.getElementById('voiceButton');
    const statusText = document.getElementById('statusText');
    const errorMessage = document.getElementById('errorMessage');
    const pulseRing = document.getElementById('pulseRing');

    let vapiInstance = null;
    let isActive = false;
    let isConnecting = false;

    function showError(msg) {
      errorMessage.textContent = msg;
      errorMessage.classList.add('visible');
      setTimeout(() => errorMessage.classList.remove('visible'), 5000);
    }

    function setActive(active) {
      isActive = active;
      isConnecting = false;
      if (active) {
        voiceButton.classList.add('active');
        voiceButton.classList.remove('connecting');
        pulseRing.classList.add('active');
        statusText.textContent = 'LISTENING...';
      } else {
        voiceButton.classList.remove('active', 'connecting');
        pulseRing.classList.remove('active');
        statusText.textContent = 'TAP TO START';
      }
    }

    function setConnecting() {
      isConnecting = true;
      voiceButton.classList.add('connecting');
      statusText.textContent = 'CONNECTING...';
    }

    // Load the Vapi HTML script tag SDK
    (function(d, t) {
      var g = document.createElement(t);
      var s = d.getElementsByTagName(t)[0];
      g.src = "https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";
      g.defer = true;
      g.async = true;
      s.parentNode.insertBefore(g, s);

      g.onload = function() {
        console.log('[Vapi] SDK loaded');
        
        if (!vapiPublicKey) {
          showError('Voice booking not configured.');
          return;
        }

        // Initialize Vapi with the widget SDK
        vapiInstance = window.vapiSDK.run({
          apiKey: vapiPublicKey,
          assistant: vapiAssistantId,
          config: {
            hide: true, // Hide the default widget button
            position: 'bottom-right'
          }
        });

        console.log('[Vapi] Instance created');

        // Listen for call events
        if (vapiInstance) {
          vapiInstance.on('call-start', () => {
            console.log('[Vapi] Call started');
            setActive(true);
          });

          vapiInstance.on('call-end', () => {
            console.log('[Vapi] Call ended');
            setActive(false);
          });

          vapiInstance.on('speech-start', () => {
            statusText.textContent = 'SPEAKING...';
          });

          vapiInstance.on('speech-end', () => {
            if (isActive) {
              statusText.textContent = 'LISTENING...';
            }
          });

          vapiInstance.on('error', (err) => {
            console.error('[Vapi] Error:', err);
            showError('Connection error. Please try again.');
            setActive(false);
          });
        }
      };

      g.onerror = function() {
        console.error('[Vapi] Failed to load SDK');
        showError('Voice service unavailable.');
      };
    })(document, 'script');

    voiceButton.addEventListener('click', async () => {
      if (!vapiInstance) {
        showError('Voice service loading...');
        return;
      }

      if (isActive) {
        vapiInstance.stop();
        setActive(false);
      } else if (!isConnecting) {
        setConnecting();
        try {
          // Pass businessSlug as metadata so our server knows which calendar to use
          await vapiInstance.start({
            metadata: {
              businessSlug: businessSlug
            },
            assistantOverrides: {
              variableValues: {
                businessSlug: businessSlug
              }
            }
          });
        } catch (err) {
          console.error('[Vapi] Start error:', err);
          showError('Microphone access required.');
          setActive(false);
        }
      }
    });
  </script>
</body>
</html>

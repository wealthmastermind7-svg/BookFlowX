<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Voice Booking - {{BUSINESS_NAME}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --black: #000000;
      --charcoal: #1a1a1a;
      --graphite: #2d2d2d;
      --smoke: #404040;
      --silver: #808080;
      --pearl: #f5f5f5;
      --white: #ffffff;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--black);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }
    
    .container {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    
    .business-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      opacity: 0.95;
    }
    
    .tagline {
      font-size: 14px;
      color: var(--silver);
      font-weight: 300;
      margin-bottom: 48px;
    }
    
    .status-container {
      margin-bottom: 32px;
      min-height: 24px;
    }
    
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--silver);
      padding: 8px 16px;
      background: var(--charcoal);
      border-radius: 20px;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--silver);
    }
    
    .status-dot.active {
      background: #22c55e;
      animation: pulse 1.5s infinite;
    }
    
    .status-dot.connecting {
      background: #f59e0b;
      animation: pulse 0.5s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .transcript-box {
      background: var(--charcoal);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 32px;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    
    .transcript-text {
      font-size: 16px;
      line-height: 1.6;
      color: var(--pearl);
      font-weight: 300;
    }
    
    .transcript-text.placeholder {
      color: var(--smoke);
      font-style: italic;
    }
    
    .call-button {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--white);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      margin: 0 auto 24px;
    }
    
    .call-button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 40px rgba(255, 255, 255, 0.2);
    }
    
    .call-button:active {
      transform: scale(0.95);
    }
    
    .call-button.active {
      background: #ef4444;
    }
    
    .call-button.active:hover {
      box-shadow: 0 0 40px rgba(239, 68, 68, 0.3);
    }
    
    .call-button svg {
      width: 32px;
      height: 32px;
      transition: all 0.3s ease;
    }
    
    .call-button.active svg {
      fill: white;
    }
    
    .instruction {
      font-size: 14px;
      color: var(--silver);
      font-weight: 300;
    }
    
    .footer {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: var(--smoke);
    }
    
    .footer a {
      color: var(--silver);
      text-decoration: none;
    }
    
    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="business-name">{{BUSINESS_NAME}}</h1>
    <p class="tagline">Voice Booking Assistant</p>
    
    <div class="status-container">
      <div class="status" id="statusBadge">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Ready to start</span>
      </div>
    </div>
    
    <div class="transcript-box">
      <p class="transcript-text placeholder" id="transcript">Tap the button below to start a voice conversation</p>
    </div>
    
    <div id="errorContainer"></div>
    
    <button class="call-button" id="callButton" onclick="toggleCall()">
      <svg id="micIcon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
      <svg id="endIcon" viewBox="0 0 24 24" fill="white" style="display: none;">
        <path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.1-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/>
      </svg>
    </button>
    
    <p class="instruction" id="instruction">Tap to start voice booking</p>
  </div>
  
  <footer class="footer">
    <a href="/book/{{BUSINESS_SLUG}}">Switch to manual booking</a>
  </footer>

  <script>
    var vapiInstance = null;
    var isCallActive = false;
    
    // Inline assistant configuration - no serverUrl needed
    const inlineAssistant = {{INLINE_ASSISTANT}};
    const apiKey = "{{PUBLIC_KEY}}";
    const businessSlug = "{{BUSINESS_SLUG}}";
    
    const buttonConfig = {
      position: "bottom-right",
      offset: "40px",
      width: "60px", 
      height: "60px",
      idle: {
        color: "rgb(255, 255, 255)",
        type: "pill",
        title: "Voice Booking",
        subtitle: "Tap to talk",
        icon: "https://unpkg.com/lucide-static@0.321.0/icons/phone.svg"
      },
      loading: {
        color: "rgb(255, 200, 100)",
        type: "pill",
        title: "Connecting...",
        subtitle: "Please wait"
      },
      active: {
        color: "rgb(239, 68, 68)",
        type: "pill",
        title: "Listening",
        subtitle: "Tap to end call"
      }
    };

    function updateStatus(status, text) {
      const dot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      
      dot.className = 'status-dot';
      if (status === 'active') dot.classList.add('active');
      if (status === 'connecting') dot.classList.add('connecting');
      
      statusText.textContent = text;
    }
    
    function updateTranscript(text, isPlaceholder = false) {
      const transcript = document.getElementById('transcript');
      transcript.textContent = text;
      transcript.className = isPlaceholder ? 'transcript-text placeholder' : 'transcript-text';
    }
    
    function showError(message) {
      const container = document.getElementById('errorContainer');
      container.innerHTML = `<div class="error-message">${message}</div>`;
      setTimeout(() => container.innerHTML = '', 5000);
    }
    
    function updateButton(active) {
      const button = document.getElementById('callButton');
      const micIcon = document.getElementById('micIcon');
      const endIcon = document.getElementById('endIcon');
      const instruction = document.getElementById('instruction');
      
      isCallActive = active;
      
      if (active) {
        button.classList.add('active');
        micIcon.style.display = 'none';
        endIcon.style.display = 'block';
        instruction.textContent = 'Tap to end call';
      } else {
        button.classList.remove('active');
        micIcon.style.display = 'block';
        endIcon.style.display = 'none';
        instruction.textContent = 'Tap to start voice booking';
      }
    }
    
    function toggleCall() {
      console.log('[Vapi] toggleCall called, isCallActive:', isCallActive);
      if (!vapiInstance) {
        showError('Voice system is still loading. Please wait a moment.');
        return;
      }
      
      if (isCallActive) {
        vapiInstance.stop();
      } else {
        updateStatus('connecting', 'Connecting...');
        updateTranscript('Starting voice conversation...', true);
        
        // Use inline assistant config - no serverUrl needed
        console.log('[Vapi] Starting call with inline assistant for:', businessSlug);
        
        vapiInstance.start(inlineAssistant);
      }
    }
    
    (function(d, t) {
      var g = d.createElement(t);
      var s = d.getElementsByTagName(t)[0];
      
      g.src = "https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";
      g.defer = true;
      g.async = true;
      
      s.parentNode.insertBefore(g, s);
      
      g.onload = function() {
        console.log('[Vapi] SDK loaded successfully');
        
        vapiInstance = window.vapiSDK.run({
          apiKey: apiKey,
          assistant: inlineAssistant,
          config: { 
            hide: true,
            position: "bottom-right"
          }
        });
        
        if (vapiInstance) {
          vapiInstance.on('call-start', function() {
            console.log('[Vapi] Call started');
            updateButton(true);
            updateStatus('active', 'Call in progress');
            updateTranscript('Listening...', true);
          });
          
          vapiInstance.on('call-end', function() {
            console.log('[Vapi] Call ended');
            updateButton(false);
            updateStatus('ready', 'Ready to start');
            updateTranscript('Call ended. Tap to start a new conversation.', true);
          });
          
          vapiInstance.on('speech-start', function() {
            updateStatus('active', 'Assistant speaking');
          });
          
          vapiInstance.on('speech-end', function() {
            updateStatus('active', 'Listening...');
          });
          
          vapiInstance.on('message', function(message) {
            if (message.type === 'transcript') {
              const prefix = message.role === 'assistant' ? 'Assistant: ' : 'You: ';
              updateTranscript(prefix + message.transcript);
            }
          });
          
          vapiInstance.on('error', function(error) {
            console.error('[Vapi] Error:', error);
            updateButton(false);
            updateStatus('ready', 'Ready to start');
            showError('Connection error. Please try again.');
            updateTranscript('An error occurred. Please try again.', true);
          });
          
          updateStatus('ready', 'Ready to start');
          console.log('[Vapi] Event handlers registered');
        }
      };
      
      g.onerror = function(error) {
        console.error('[Vapi] Failed to load SDK:', error);
        showError('Failed to load voice system. Please refresh the page.');
      };
    })(document, 'script');
  </script>
</body>
</html>

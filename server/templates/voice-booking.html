<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Informational Assistant - {{BUSINESS_NAME}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
    
    :root {
      --pure-black: #000000;
      --charcoal: #0a0a0a;
      --graphite: #141414;
      --smoke: #6b6b6b;
      --silver: #9e9e9e;
      --pearl: #f5f5f5;
      --white: #ffffff;
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.15; }
      50% { transform: scale(1.08); opacity: 0.25; }
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--pure-black);
      color: var(--white);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-top: calc(var(--safe-top) + 24px);
      padding-bottom: calc(var(--safe-bottom) + 24px);
      overflow: hidden;
    }
    
    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 1s ease;
    }
    
    .business-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px;
      font-weight: 500;
      letter-spacing: -0.5px;
      color: var(--pearl);
      margin-bottom: 8px;
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .page-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 72px;
      font-weight: 700;
      letter-spacing: -3px;
      line-height: 0.9;
      color: var(--white);
      margin-bottom: 16px;
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
    }
    
    .tagline {
      font-size: 15px;
      color: var(--smoke);
      font-weight: 400;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 48px;
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
    }

    .mic-area {
      position: relative;
      width: 160px;
      height: 160px;
      margin-bottom: 24px;
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
    }

    .mic-glow {
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 70%);
      animation: breathe 4s ease-in-out infinite;
      pointer-events: none;
    }

    .call-button {
      width: 120px;
      height: 120px;
      border-radius: 60px;
      background: var(--white);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 20px 60px rgba(255,255,255,0.12);
      z-index: 2;
    }
    
    .call-button:hover {
      transform: translate(-50%, -50%) scale(1.05);
      box-shadow: 0 24px 80px rgba(255,255,255,0.18);
    }
    
    .call-button:active {
      transform: translate(-50%, -50%) scale(0.95);
    }
    
    .call-button.active {
      background: var(--white);
    }

    .call-button.active .mic-glow-active {
      display: block;
    }
    
    .call-button svg {
      width: 36px;
      height: 36px;
      transition: all 0.3s ease;
    }
    
    .call-button.active svg { fill: #000; }

    .status-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--smoke);
      text-transform: uppercase;
      letter-spacing: 4px;
      margin-bottom: 40px;
      min-height: 16px;
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
    }

    .status-label.active {
      color: var(--pearl);
      animation: pulse 2s infinite;
    }

    .transcript-glass {
      background: var(--glass-bg);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 28px 24px;
      width: 100%;
      min-height: 80px;
      margin-bottom: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both;
    }
    
    .transcript-text {
      font-size: 16px;
      line-height: 1.7;
      color: var(--pearl);
      font-weight: 300;
    }
    
    .transcript-text.placeholder {
      color: var(--smoke);
      font-weight: 300;
      font-size: 15px;
    }

    .footer-links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s both;
    }

    .btn-primary {
      width: 100%;
      display: block;
      padding: 18px;
      background: var(--white);
      color: var(--pure-black);
      text-decoration: none;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-primary:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 32px rgba(255,255,255,0.1);
    }

    .btn-ghost {
      width: 100%;
      display: block;
      padding: 18px;
      background: transparent;
      color: var(--white);
      text-decoration: none;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 500;
      border: 1px solid rgba(255,255,255,0.12);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-ghost:hover {
      background: rgba(255,255,255,0.04);
      border-color: rgba(255,255,255,0.2);
    }
    
    .powered {
      margin-top: 40px;
      font-size: 11px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 1px;
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.7s both;
    }
    .powered a { color: rgba(255,255,255,0.3); text-decoration: none; }

    .error-message {
      position: fixed;
      top: calc(var(--safe-top) + 24px);
      left: 24px;
      right: 24px;
      background: rgba(220, 38, 38, 0.9);
      backdrop-filter: blur(20px);
      color: white;
      padding: 14px 20px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      z-index: 1000;
    }
    .error-message.visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-height: 700px) {
      .page-title { font-size: 56px; }
      .tagline { margin-bottom: 32px; }
      .mic-area { width: 130px; height: 130px; margin-bottom: 16px; }
      .call-button { width: 100px; height: 100px; border-radius: 50px; }
      .transcript-glass { padding: 20px 18px; min-height: 60px; margin-bottom: 28px; }
    }
  </style>
</head>
<body>
  <div id="errorContainer" class="error-message"></div>

  <div class="container">
    <h1 class="business-name">{{BUSINESS_NAME}}</h1>
    <div class="page-title">VOICE<br>ASSISTANT</div>
    <p class="tagline">Informational Assistant</p>

    <div class="mic-area">
      <div class="mic-glow"></div>
      <button class="call-button" id="callButton" onclick="toggleCall()">
        <svg id="micIcon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
        <svg id="endIcon" viewBox="0 0 24 24" fill="white" style="display: none;">
          <path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.1-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/>
        </svg>
      </button>
    </div>

    <div class="status-label" id="statusLabel">TAP TO START</div>

    <div class="transcript-glass">
      <p class="transcript-text placeholder" id="transcript">Tap the microphone to start a voice conversation</p>
    </div>

    <div class="footer-links">
      <a href="/book/{{BUSINESS_SLUG}}" class="btn-primary">Text Booking</a>
      <a href="https://apps.apple.com/app/bookflowx/id6756943439" class="btn-ghost">Get the App</a>
    </div>

    <div class="powered">Powered by <a href="https://confirmbooking.online">BookFlow</a></div>
  </div>
  
  <script>
    var vapiInstance = null;
    var isCallActive = false;
    
    const inlineAssistant = {{INLINE_ASSISTANT}};
    const apiKey = "{{PUBLIC_KEY}}";
    const businessSlug = "{{BUSINESS_SLUG}}";
    
    const buttonConfig = {
      position: "bottom-right",
      offset: "40px",
      width: "60px", 
      height: "60px",
      idle: {
        color: "rgb(255, 255, 255)",
        type: "pill",
        title: "Informational Assistant",
        subtitle: "Tap to ask questions",
        icon: "https://unpkg.com/lucide-static@0.321.0/icons/phone.svg"
      },
      loading: {
        color: "rgb(255, 200, 100)",
        type: "pill",
        title: "Connecting...",
        subtitle: "Please wait"
      },
      active: {
        color: "rgb(239, 68, 68)",
        type: "pill",
        title: "Listening",
        subtitle: "Tap to end call"
      }
    };

    function updateStatus(status, text) {
      const label = document.getElementById('statusLabel');
      label.textContent = text.toUpperCase();
      
      if (status === 'active') {
        label.classList.add('active');
      } else {
        label.classList.remove('active');
      }
    }
    
    function updateTranscript(text, isPlaceholder = false) {
      const transcript = document.getElementById('transcript');
      transcript.textContent = text;
      transcript.className = isPlaceholder ? 'transcript-text placeholder' : 'transcript-text';
    }
    
    function showError(message) {
      const container = document.getElementById('errorContainer');
      container.textContent = message;
      container.classList.add('visible');
      setTimeout(() => container.classList.remove('visible'), 5000);
    }
    
    function updateButton(active) {
      const button = document.getElementById('callButton');
      const micIcon = document.getElementById('micIcon');
      const endIcon = document.getElementById('endIcon');
      
      isCallActive = active;
      
      if (active) {
        button.classList.add('active');
        micIcon.style.display = 'none';
        endIcon.style.display = 'block';
        updateStatus('active', 'Tap to end');
      } else {
        button.classList.remove('active');
        micIcon.style.display = 'block';
        endIcon.style.display = 'none';
        updateStatus('ready', 'Tap to start');
      }
    }
    
    async function checkMinutesBeforeCall() {
      try {
        const res = await fetch('/api/voice/' + businessSlug + '/check-minutes');
        if (!res.ok) return { available: true };
        return await res.json();
      } catch (e) {
        console.warn('[Vapi] Minutes check failed, allowing call:', e);
        return { available: true };
      }
    }

    function showExhaustedOverlay(data) {
      const container = document.querySelector('.container');
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn 0.4s ease;';
      
      let upgradeHtml = '';
      if (data.upgradeTo) {
        upgradeHtml = '<div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:24px;margin-bottom:16px;text-align:left;">' +
          '<div style="font-size:10px;font-weight:700;letter-spacing:2px;color:rgba(255,255,255,0.3);text-transform:uppercase;margin-bottom:12px;">UPGRADE TO CONTINUE ASSISTING CUSTOMERS</div>' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">' +
            '<span style="font-size:20px;font-weight:700;">' + data.upgradeTo.name + '</span>' +
            '<span style="font-size:20px;font-weight:700;">' + data.upgradeTo.price + '</span>' +
          '</div>' +
          '<div style="font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:16px;">' + data.upgradeTo.minutes + ' minutes allowance per month</div>' +
          '<a href="/billing/' + businessSlug + '" style="display:block;width:100%;padding:16px;background:#fff;color:#000;text-decoration:none;border-radius:16px;font-size:15px;font-weight:600;text-align:center;">Upgrade Now</a>' +
        '</div>';
      }

      overlay.innerHTML = '<div style="width:100%;max-width:420px;text-align:center;">' +
        '<div style="font-family:Cormorant Garamond,serif;font-size:48px;font-weight:700;letter-spacing:-2px;line-height:0.95;margin-bottom:32px;">ALLOWANCE<br>REACHED</div>' +
        '<div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:24px;margin-bottom:16px;">' +
          '<div style="display:inline-block;padding:4px 14px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:1.5px;background:rgba(239,68,68,0.2);color:#EF4444;margin-bottom:12px;">' + (data.currentTier || 'FREE').toUpperCase() + ' PLAN</div>' +
          '<div style="font-size:16px;font-weight:600;margin-bottom:6px;">Monthly allowance reached</div>' +
          '<div style="font-size:13px;color:rgba(255,255,255,0.4);margin-bottom:16px;">' + data.minutesUsed + ' of ' + data.minutesLimit + ' minutes allowance used</div>' +
          '<div style="height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden;"><div style="height:100%;background:#EF4444;border-radius:3px;width:100%;"></div></div>' +
        '</div>' +
        upgradeHtml +
        '<a href="/book/' + businessSlug + '" style="display:block;width:100%;padding:18px;background:transparent;color:#fff;text-decoration:none;border-radius:20px;font-size:16px;font-weight:500;border:1px solid rgba(255,255,255,0.12);margin-bottom:12px;">Book Online Instead</a>' +
        '<button onclick="this.closest(\'div[style]\').parentElement.remove()" style="display:block;width:100%;padding:14px;background:transparent;color:rgba(255,255,255,0.4);border:none;cursor:pointer;font-size:14px;font-weight:400;">Dismiss</button>' +
      '</div>';
      
      document.body.appendChild(overlay);
    }

    async function toggleCall() {
      console.log('[Vapi] toggleCall called, isCallActive:', isCallActive);
      if (!vapiInstance) {
        showError('Voice system is still loading. Please wait a moment.');
        return;
      }
      
      if (isCallActive) {
        vapiInstance.stop();
      } else {
        updateStatus('connecting', 'Checking allowance...');
        
        var minuteCheck = await checkMinutesBeforeCall();
        if (minuteCheck.isExhausted) {
          showExhaustedOverlay(minuteCheck);
          updateStatus('ready', 'Tap to start');
          return;
        }
        
        updateTranscript('Starting voice conversation...', true);
        updateStatus('connecting', 'Connecting...');
        
        console.log('[Vapi] Starting call with inline assistant for:', businessSlug);
        
        vapiInstance.start(inlineAssistant);
      }
    }
    
    (function(d, t) {
      var g = d.createElement(t);
      var s = d.getElementsByTagName(t)[0];
      
      g.src = "https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";
      g.defer = true;
      g.async = true;
      
      s.parentNode.insertBefore(g, s);
      
      g.onload = function() {
        console.log('[Vapi] SDK loaded successfully');
        
        vapiInstance = window.vapiSDK.run({
          apiKey: apiKey,
          assistant: inlineAssistant,
          config: { 
            hide: true,
            position: "bottom-right"
          }
        });
        
        if (vapiInstance) {
          vapiInstance.on('call-start', function() {
            console.log('[Vapi] Call started');
            updateButton(true);
            updateStatus('active', 'Call in progress');
            updateTranscript('Listening...', true);
            
            // Periodically check minutes mid-call, but allow current to finish
            setInterval(async () => {
              const check = await checkMinutesBeforeCall();
              if (check.isExhausted) {
                console.log('[Vapi] Allowance reached mid-call, allowing current call to finish');
              }
            }, 60000);
          });
          
          vapiInstance.on('call-end', function() {
            console.log('[Vapi] Call ended');
            updateButton(false);
            updateStatus('ready', 'Tap to start');
            updateTranscript('Call ended. Tap to start a new conversation.', true);
          });
          
          vapiInstance.on('speech-start', function() {
            updateStatus('active', 'Speaking...');
          });
          
          vapiInstance.on('speech-end', function() {
            updateStatus('active', 'Listening...');
          });
          
          vapiInstance.on('message', function(message) {
            if (message.type === 'transcript') {
              var prefix = message.role === 'assistant' ? 'Assistant: ' : 'You: ';
              updateTranscript(prefix + message.transcript);
            }
          });
          
          vapiInstance.on('error', function(error) {
            console.error('[Vapi] Error:', error);
            updateButton(false);
            updateStatus('ready', 'Tap to start');
            showError('Connection error. Please try again.');
            updateTranscript('An error occurred. Please try again.', true);
          });
          
          updateStatus('ready', 'Tap to start');
          console.log('[Vapi] Event handlers registered');
        }
      };
      
      g.onerror = function(error) {
        console.error('[Vapi] Failed to load SDK:', error);
        showError('Failed to load voice system. Please refresh the page.');
      };
    })(document, 'script');
  </script>
</body>
</html>
